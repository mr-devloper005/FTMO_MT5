# Proves the research PC deployment on real Windows (GitHub's windows-latest runner).
#
#   tests              the Windows-relevant suites under the runner's default cp1252 locale (PYTHONUTF8 unset,
#                      so any text I/O without encoding="utf-8" would show up), both PowerShell editions,
#                      and the Agent SDK's bundled claude.exe.
#   install-rehearsal  the real install on a fresh Windows machine: export a transfer folder from this checkout
#                      (what the Mac does), then deploy/windows/02..05 from it, then check the service, health,
#                      stop/start, backup and uninstall.
#
# Not provable here (see deploy/windows/WINDOWS_VERIFICATION.md): the PC's own network (B2), a Claude credential
# for the service (B1), domain policies on the service account, reboot survival.
# Research only: no broker credentials exist in this workflow and nothing here can place an order.

name: windows

on:
  push:
    branches: [master, "windows-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on Windows (cp1252, no PYTHONUTF8)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/windows/requirements-research.lock.txt

      - name: Install the pinned research lock (the same file the PC installs)
        run: python -m pip install --disable-pip-version-check -r deploy/windows/requirements-research.lock.txt

      - name: Show the encoding Python uses by default here
        run: python -c "import locale, sys; print('preferred encoding:', locale.getpreferredencoding(False), '| utf8 mode:', sys.flags.utf8_mode)"

      - name: Windows compatibility, operations and deployment-script tests (incl. pwsh + live dashboard)
        run: python -m pytest -q -p no:cacheprovider tests/test_windows_compat.py tests/test_ops.py tests/test_windows_scripts.py

      - name: Research agent, management credibility, quality engine, systematic pipeline
        run: python -m pytest -q -p no:cacheprovider tests/test_research_agent.py tests/test_mcs.py tests/test_quality.py tests/test_systematic.py

      # tests/test_lab.py and mcp_server/test_server.py read the local Yahoo price cache (study/lab/cache, not in
      # git), so they cannot run on a fresh machine; the MCP server is not part of the research PC install.
      - name: Backtest engine and strategies
        run: python -m pytest -q -p no:cacheprovider tests/test_backtest.py tests/test_mtf_strategy.py

      - name: Every deploy script parses in Windows PowerShell 5.1 (what a stock PC has)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem deploy/windows/*.ps1) {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e) | Out-Null
            foreach ($x in $e) { Write-Output ("{0}:{1} {2}" -f $f.Name, $x.Extent.StartLineNumber, $x.Message); $bad++ }
          }
          if ($bad) { exit 1 }
          Write-Output "all deploy scripts parse in PowerShell $($PSVersionTable.PSVersion)"

      - name: The Agent SDK's bundled Claude CLI starts on Windows (B3, no credentials needed)
        run: |
          $dir = python -c "import claude_agent_sdk, pathlib; print(pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled')"
          $exe = Get-ChildItem $dir -Filter 'claude*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $dir; throw "no bundled claude.exe in $dir" }
          & $exe.FullName --version
          if ($LASTEXITCODE) { throw "claude.exe --version exited $LASTEXITCODE" }

  install-rehearsal:
    name: Install rehearsal, route ${{ matrix.route }} (02..05 -> service)
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # clone    = route B: git clone to C:\ftmo\app, empty data (what the PC with Claude Code does)
        # transfer = route A: Mac export folder (git bundle + data), for a PC without GitHub access
        route: [clone, transfer]
    env:
      FTMO_ROOT: C:\ftmo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the transfer carries a git bundle with full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use the runner's PostgreSQL (the PC uses PostgreSQL 16; the scripts take PG_BIN / PG_SERVICE)
        run: |
          $svc = Get-Service 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'no PostgreSQL service on this runner' }
          Set-Service $svc.Name -StartupType Automatic
          Start-Service $svc.Name
          "PG_SERVICE=$($svc.Name)" >> $env:GITHUB_ENV
          "PG_BIN=$env:PGBIN" >> $env:GITHUB_ENV
          "FTMO_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          & "$env:PGBIN\psql.exe" --version

      - name: "Step 2: compile pgvector with MSVC (B4)"
        run: ./deploy/windows/02-build-pgvector.ps1

      - name: Write the secrets file (research keys only; no Claude key in CI)
        run: |
          $pw = [guid]::NewGuid().ToString('N') + 'aA1!'
          Write-Output "::add-mask::$pw"
          $f = Join-Path $env:RUNNER_TEMP 'secrets\.env.windows'
          New-Item -ItemType Directory -Force (Split-Path $f) | Out-Null
          Set-Content -Path $f -Encoding ASCII -Value @('POSTGRES_HOST=localhost', 'POSTGRES_PORT=5432',
            'POSTGRES_DB=ftmo_rag', 'POSTGRES_USER=ftmo_rag', "POSTGRES_PASSWORD=$pw")
          "FTMO_SECRETS=$f" >> $env:GITHUB_ENV

      - name: "Step 3: RAG role and databases with pgvector"
        env:
          FTMO_PG_SUPERUSER_PASSWORD: root     # the runner image's documented postgres password
        run: ./deploy/windows/03-setup-database.ps1 -SecretsFile $env:FTMO_SECRETS

      - name: "Route A, Mac side: export a transfer folder from this checkout"
        if: matrix.route == 'transfer'
        run: |
          if ((git rev-parse --abbrev-ref HEAD) -ne 'master') { git branch -f master HEAD }   # 04 clones master
          foreach ($line in Get-Content $env:FTMO_SECRETS) { $k, $v = $line -split '=', 2; Set-Item "Env:$k" $v }
          $env:PYTHONUTF8 = '1'
          $venv = Join-Path $env:RUNNER_TEMP 'export-venv'
          python -m venv $venv
          & "$venv\Scripts\python" -m pip install --disable-pip-version-check -q -r deploy/windows/requirements-research.lock.txt
          & "$venv\Scripts\python" -m rag db-init
          if ($LASTEXITCODE) { throw 'rag db-init failed' }
          & "$venv\Scripts\python" -m research_agent status
          & "$venv\Scripts\python" -m research_agent transfer-export --out "$env:RUNNER_TEMP\transfer"
          if ($LASTEXITCODE) { throw 'transfer-export failed' }
          $t = Get-ChildItem "$env:RUNNER_TEMP\transfer" -Directory | Select-Object -First 1
          Get-ChildItem $t.FullName | Format-Table Name, Length
          "FTMO_TRANSFER=$($t.FullName)" >> $env:GITHUB_ENV

      - name: "Route B: clone the code to C:/ftmo/app"
        if: matrix.route == 'clone'
        run: |
          # a pull request checkout is a detached merge commit, so check out exactly the commit under test
          git clone --quiet --no-checkout "$env:GITHUB_WORKSPACE" C:\ftmo\app
          git -C C:\ftmo\app checkout --quiet $env:GITHUB_SHA
          git -C C:\ftmo\app log --oneline -1

      - name: "Step 4, route A: code, venv and data from the transfer (runs the self-tests on the installed copy)"
        if: matrix.route == 'transfer'
        run: ./deploy/windows/04-setup-app.ps1 -Transfer $env:FTMO_TRANSFER -SecretsFile $env:FTMO_SECRETS -Online

      - name: "Step 4, route B: venv and empty data from the clone (runs the self-tests on the installed copy)"
        if: matrix.route == 'clone'
        run: C:\ftmo\app\deploy\windows\04-setup-app.ps1 -SecretsFile $env:FTMO_SECRETS

      - name: Install NSSM (the PC gets it from 01-install-prereqs.ps1)
        run: choco install nssm -y --no-progress

      - name: "Step 5: Windows service under a non-admin account + scheduled tasks (B5)"
        run: ./deploy/windows/05-install-services.ps1

      - name: Verify the service, health, tasks, health check and backup
        run: |
          . ./deploy/windows/common.ps1
          $s = Get-CimInstance Win32_Service -Filter "Name='FTMO-Research'"
          Write-Output "service: $($s.State), start mode $($s.StartMode), account $($s.StartName)"
          if ($s.State -ne 'Running') { throw "FTMO-Research is $($s.State)" }
          if ($s.StartName -notmatch 'ftmo-svc') { throw "service runs as $($s.StartName), expected .\ftmo-svc" }
          $h = Get-Health
          $h | ConvertTo-Json -Depth 6
          if (-not $h -or $h.status -notin @('ok', 'degraded')) { throw "health is $($h.status)" }
          Get-ScheduledTask -TaskPath '\FTMO\' | Format-Table TaskName, State
          if ((Get-ScheduledTask -TaskPath '\FTMO\').Count -ne 3) { throw 'expected 3 scheduled tasks' }
          & ./deploy/windows/healthcheck.ps1
          Write-Output "healthcheck exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -eq 2) { throw 'health check reports down' }
          & ./deploy/windows/backup.ps1
          if ($LASTEXITCODE) { throw 'backup failed (see C:\ftmo\logs\backup.log)' }
          $b = Get-ChildItem C:\ftmo\backups -Directory -Filter 'ftmo-backup-*'
          if (-not $b) { throw 'no backup folder written' }
          Get-ChildItem $b[-1].FullName | Format-Table Name, Length
          $global:LASTEXITCODE = 0

      - name: Stopping the service leaves no research process behind, and it starts again (W2)
        run: |
          . ./deploy/windows/common.ps1
          Stop-Service FTMO-Research
          Start-Sleep -Seconds 5
          $left = Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'research_agent' }
          if ($left) { $left | Format-Table ProcessId, CommandLine -AutoSize; throw 'research_agent processes survived the stop' }
          Start-Service FTMO-Research
          $h = $null
          for ($i = 0; $i -lt 24 -and -not $h; $i++) { Start-Sleep -Seconds 5; $h = Get-Health }
          if (-not $h) { throw 'no health answer after the restart' }
          Write-Output "after restart: $($h.status)"

      - name: Uninstall removes the service and keeps the data
        run: |
          ./deploy/windows/uninstall-services.ps1
          if (Get-Service FTMO-Research -ErrorAction SilentlyContinue) { throw 'service still installed' }
          if (Get-ScheduledTask -TaskPath '\FTMO\' -ErrorAction SilentlyContinue) { throw 'scheduled tasks still registered' }
          if (-not (Test-Path C:\ftmo\app\research_agent\state\research.db)) { throw 'research.db was removed' }
          Write-Output 'uninstalled; data kept'

      - name: Upload the install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftmo-windows-install-logs-${{ matrix.route }}
          path: C:\ftmo\logs
          if-no-files-found: ignore
