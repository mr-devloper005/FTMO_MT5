[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nehanth-ftmo-mt5"
version = "1.0.0"
description = "Institutional-grade FTMO MT5 trading system with multi-agent orchestration, ML-based signal filtering, and FTMO-compliant risk management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FTMO Trading Systems", email = "trading@ftmo.example.com"}
]
keywords = ["trading", "ftmo", "mt5", "algorithmic", "risk-management", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Point-of-Sale",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pydantic>=2.0",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-prometheus",
    "prometheus-client",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "aiohttp",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0",
    "black>=23.0",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
# The /agents page only. Optional because the hub must still start without it:
# broker_hub degrades that one page to a setup message rather than failing to
# import. Needs Python >= 3.10, which the project venv already satisfies.
agent = [
    "claude-agent-sdk",
]

[project.scripts]
ftmo-mt5 = "ftmo_mt5.main:main"

[tool.setuptools.packages.find]
# Flat layout with several top-level dirs (study/, config/, logs/, mcp_server/).
# Only ftmo_mt5 is the installable package; the rest are scripts and data.
include = ["ftmo_mt5*"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "ANN", "ASYNC", "BLE", "C4", "C90", "G"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ANN001", "ANN002", "ANN201", "S101"]

[tool.ruff.isort]
known-first-party = ["ftmo_mt5"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers --tb=short -p no:warnings"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ftmo_mt5"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
